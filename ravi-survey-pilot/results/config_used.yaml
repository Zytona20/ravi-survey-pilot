name: colab_survey
out_dir: /content/ravi_runs/colab_survey
seed: 0
dataset:
  name: food101
  n_base: 75750
  n_query: 2020
  base:
    type: hf
    path: ethz/food101
    split: train
    cache_dir: /content/hf_cache
  query:
    type: hf
    path: ethz/food101
    split: validation
    per_class: 20
    cache_dir: /content/hf_cache
models:
- name: resnet50.a1_in1k
  family: resnet
  paradigm: supervised
  dim: 2048
- name: convnext_base.fb_in22k_ft_in1k
  family: convnext
  paradigm: supervised-22k
  dim: 1024
- name: vit_base_patch16_224.augreg_in21k_ft_in1k
  family: vit-supervised
  paradigm: supervised
  dim: 768
- name: vit_base_patch16_clip_224.openai
  family: clip
  paradigm: image-text
  dim: 512
  keep_head: true
- name: vit_base_patch14_dinov2.lvd142m
  family: dinov2
  paradigm: self-distillation
  dim: 768
  img_size: 224
- name: vit_base_patch16_224.mae
  family: mim
  paradigm: masked-image-modeling
  dim: 768
extract:
  batch_size: 128
  workers: 2
  amp: true
dims:
- 64
- 128
- 256
reductions:
- pca
- head_rank
- head_hub
- head_koleo
reduction_dims:
  head_rank:
  - 256
  head_hub:
  - 256
  head_koleo:
  - 256
fit_sample: 50000
geometry:
  sample: 20000
  k: 20
head:
  defaults:
    steps: 3000
    batch: 2048
    eval_every: 1000
    n_val: 2000
  variants:
    head_rank: {}
    head_hub:
      lam_hub: 3.0
    head_koleo:
      lam_koleo: 1.0
bench:
  seeds:
  - 0
  - 1
  n_latency_queries: 1000
  repeats: 2
  hnsw:
    M:
    - 16
    efConstruction: 200
    efSearch:
    - 10
    - 16
    - 32
    - 64
    - 128
    - 256
    - 512
    - 1024
  ivf:
    nlist:
    - 256
    nprobe:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 32
    - 64
    - 128
    - 256
  ivfpq: null
  recall_targets:
  - 0.8
  - 0.9
  - 0.95
survey:
  card_dim: 256
  targets:
  - 0.8
  - 0.9
  heads:
  - head_rank
  - head_hub
  - head_koleo
crossmodal:
  model: ViT-B-16
  pretrained: openai
  batch_size: 256
recommender:
  basis: e2e_recall
  target: 0.9
  metric: inv_ndis
stats:
  n_boot: 2000
